<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SwasthyaSetu</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 40%, #e0f2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), 0 0 20px rgba(16, 185, 129, 0.1);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            margin: 20px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.1), 0 0 30px rgba(16, 185, 129, 0.15);
        }
        .logo { text-align: center; margin-bottom: 35px; }
        .logo i { font-size: 56px; color: #10b981; filter: drop-shadow(0 4px 6px rgba(16,185,129,0.3)); margin-bottom: 10px; }
        .logo h1 { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; color: #0f172a; margin-top: 10px; letter-spacing: -0.5px; }
        .logo p { color: #475569; margin-top: 6px; font-size: 15px; }
        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.9);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            color: #0f172a;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        input:focus {
            outline: none;
            border-color: #10b981;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(16,185,129,0.15);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16,185,129,0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16,185,129,0.4); }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }
        .otp-group { display: none; }
        .resend-link { text-align: center; margin-top: 15px; font-size: 14px; display: none; }
        .resend-link a { color: #10b981; text-decoration: none; cursor: pointer; font-weight: 500; }
        .resend-link a:hover { text-decoration: underline; }
        .error-message { color: #e74c3c; font-size: 14px; margin-top: 5px; display: none; }
        .success-message { color: #27ae60; font-size: 14px; margin-top: 5px; display: none; }
        .loading { display: none; text-align: center; margin-top: 10px; }
        .spinner {
            border: 3px solid rgba(16,185,129,0.2);
            border-top: 3px solid #10b981;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-heartbeat"></i>
            <h1>SwasthyaSetu</h1>
            <p>Unified Health Record & Clinical Summary</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input type="tel" id="mobileNumber" placeholder="Enter 10-digit mobile number" maxlength="10" required>
                <div class="error-message" id="mobileError"></div>
            </div>
            <div class="form-group otp-group" id="otpGroup">
                <label for="otp">OTP</label>
                <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6">
                <div class="error-message" id="otpError"></div>
                <div class="success-message" id="otpSuccess"></div>
            </div>
            <button type="submit" class="btn" id="submitBtn">Send OTP</button>
            <div class="loading" id="loading"><div class="spinner"></div> Processing...</div>
        </form>
        <div class="resend-link" id="resendLink"><a id="resendOtp">Didn't receive OTP? Resend</a></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:5000/api';
        let step = 'mobile';
        let currentMobile = '';

        const mobileInput = document.getElementById('mobileNumber');
        const otpGroup = document.getElementById('otpGroup');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resendLink = document.getElementById('resendLink');
        const mobileError = document.getElementById('mobileError');
        const otpError = document.getElementById('otpError');
        const otpSuccess = document.getElementById('otpSuccess');

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (step === 'mobile') await requestOTP();
            else await verifyOTP();
        });

        async function requestOTP() {
            const mobileNumber = mobileInput.value.trim();
            if (!mobileNumber || mobileNumber.length !== 10) {
                showError(mobileError, 'Please enter a valid 10-digit mobile number');
                return;
            }
            hideError(mobileError);
            showLoading();
            try {
                const response = await axios.post(`${API_BASE_URL}/auth/request-otp`, { mobileNumber });
                if (response.data.success) {
                    currentMobile = mobileNumber;
                    step = 'otp';
                    otpGroup.style.display = 'block';
                    submitBtn.textContent = 'Verify OTP';
                    resendLink.style.display = 'block';
                    if (response.data.mockOtp) {
                        console.log('Mock OTP:', response.data.mockOtp);
                        showSuccess(otpSuccess, `OTP sent to ${mobileNumber} (Mock: ${response.data.mockOtp})`);
                    } else {
                        showSuccess(otpSuccess, `OTP sent to ${mobileNumber}`);
                    }
                } else {
                    showError(mobileError, response.data.message || 'Failed to send OTP');
                }
            } catch (error) {
                const msg = error.response?.data?.message || 'Network error. Please try again.';
                showError(mobileError, msg);
            } finally {
                hideLoading();
            }
        }

        async function verifyOTP() {
            const otp = document.getElementById('otp').value.trim();
            if (!otp || otp.length !== 6) {
                showError(otpError, 'Please enter a valid 6-digit OTP');
                return;
            }
            hideError(otpError);
            hideSuccess(otpSuccess);
            showLoading();
            try {
                const response = await axios.post(`${API_BASE_URL}/auth/verify-otp`, {
                    mobileNumber: currentMobile,
                    otp,
                    name: '',
                    role: 'doctor'
                });
                if (response.data.success) {
                    localStorage.setItem('authToken', response.data.data.token);
                    localStorage.setItem('user', JSON.stringify(response.data.data.user));
                    window.location.href = 'index.html';
                } else {
                    showError(otpError, response.data.message || 'Invalid OTP');
                }
            } catch (error) {
                const msg = error.response?.data?.message || 'Verification failed. Please try again.';
                showError(otpError, msg);
            } finally {
                hideLoading();
            }
        }

        document.getElementById('resendOtp').addEventListener('click', async () => {
            if (!currentMobile) return;
            hideError(otpError);
            hideSuccess(otpSuccess);
            showLoading();
            try {
                const response = await axios.post(`${API_BASE_URL}/auth/request-otp`, { mobileNumber: currentMobile });
                if (response.data.success) {
                    if (response.data.mockOtp) showSuccess(otpSuccess, `New OTP sent (Mock: ${response.data.mockOtp})`);
                    else showSuccess(otpSuccess, 'New OTP sent successfully');
                } else {
                    showError(otpError, response.data.message || 'Failed to resend OTP');
                }
            } catch (error) {
                showError(otpError, 'Failed to resend OTP. Please try again.');
            } finally {
                hideLoading();
            }
        });

        function showError(el, msg) { el.textContent = msg; el.style.display = 'block'; }
        function hideError(el) { el.style.display = 'none'; el.textContent = ''; }
        function showSuccess(el, msg) { el.textContent = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 5000); }
        function hideSuccess(el) { el.style.display = 'none'; el.textContent = ''; }
        function showLoading() { loading.style.display = 'block'; submitBtn.disabled = true; }
        function hideLoading() { loading.style.display = 'none'; submitBtn.disabled = false; }

        // Auto-focus OTP field when visible
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'style' && otpGroup.style.display === 'block') {
                    document.getElementById('otp').focus();
                    observer.disconnect();
                }
            });
        });
        observer.observe(otpGroup, { attributes: true });
    </script>
</body>
</html>
